{% load i18n %}
{% get_current_language as CURRENT_LANGUAGE %}
{% get_available_languages as LANGUAGES %}

<div class="dropdown">
  <button class="topbar-icon-btn d-flex align-items-center gap-1 px-2" style="width:auto;"
          data-bs-toggle="dropdown" aria-label="{% trans 'Switch Language' %}">
    <i class="bi bi-translate"></i>
    <span class="d-none d-sm-inline" style="font-size:.8rem;font-weight:600;">
      {% if CURRENT_LANGUAGE == 'km' %}ខ្មែរ{% else %}EN{% endif %}
    </span>
    <i class="bi bi-chevron-down" style="font-size:.6rem;"></i>
  </button>
  <ul class="dropdown-menu dropdown-menu-end shadow" style="min-width:140px;">
    <li>
      <h6 class="dropdown-header" style="font-size:.7rem;">
        <i class="bi bi-translate me-1"></i>{% trans "Language" %}
      </h6>
    </li>
    {% for lang_code, lang_name in LANGUAGES %}
    <li>
      <form action="{% url 'set_language' %}" method="post" class="d-inline">
        {% csrf_token %}
        <input type="hidden" name="language" value="{{ lang_code }}">
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button type="submit"
          class="dropdown-item d-flex align-items-center gap-2 {% if lang_code == CURRENT_LANGUAGE %}active{% endif %}">
          {% if lang_code == 'km' %}
            <span style="font-size:1.1rem;">🇰🇭</span>
            <span>ខ្មែរ</span>
          {% else %}
            <span style="font-size:1.1rem;">🇬🇧</span>
            <span>English</span>
          {% endif %}
          {% if lang_code == CURRENT_LANGUAGE %}
            <i class="bi bi-check-lg ms-auto text-primary"></i>
          {% endif %}
        </button>
      </form>
    </li>
    {% endfor %}
  </ul>
</div>
